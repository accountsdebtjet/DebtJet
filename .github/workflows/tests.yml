name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the app's script files (syntax, duplicate names, load order)
        run: |
          npm install --no-save --no-package-lock acorn@8
          node tools/check-scripts.js

      - name: Unit tests (server-side interest check) and shared-code copies
        run: |
          bash tools/check-shared.sh
          node --experimental-strip-types --test tests/unit/*.test.ts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run the browser tests
        run: python tests/e2e/run_all.py

      - name: Keep screenshots if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/e2e/out/
          retention-days: 7
